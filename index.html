<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Office Status</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css"
    />

    <style>
      :root {
        --w: 1872;
        --h: 1404;

        --ink: #090909;
        --muted: #555;
        --soft: #777;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
      }

      body {
        display: grid;
        place-items: start;
      }

      .stage {
        width: calc(var(--w) * 1px);
        height: calc(var(--h) * 1px);
        position: relative;
        overflow: hidden;
      }

      .scale {
        transform-origin: top left;
        transform: scale(calc(100vw / (var(--w) * 1px)));
      }

      .bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(1);
        opacity: 0.82;
        z-index: 0;
      }

      .bg-fade {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.08) 0%,
            rgba(255, 255, 255, 0.14) 42%,
            rgba(255, 255, 255, 0.2) 72%,
            rgba(255, 255, 255, 0.26) 100%
          ),
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.42) 0%,
            rgba(255, 255, 255, 0.08) 48%,
            rgba(255, 255, 255, 0) 100%
          );
      }

      .layout {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 560px;
        visibility: hidden;
      }

      .hero {
        position: relative;
        padding: 320px 90px 90px 108px;
      }

      .status {
        font-size: 172px;
        line-height: 0.88;
        font-weight: 900;
        text-transform: uppercase;
        margin: 0 0 34px;
        max-width: 1050px;
      }

      .sub {
        max-width: 760px;
        font-size: 42px;
        line-height: 1.22;
        font-weight: 620;
        color: var(--muted);
        margin: 0;
      }

      .identity {
        position: absolute;
        left: 110px;
        bottom: 76px;
        z-index: 3;
        max-width: 980px;
        color: rgba(0, 0, 0, 0.62);
      }

      .identity-quote {
        font-size: 28px;
        line-height: 1.28;
        font-weight: 720;
        letter-spacing: -0.025em;
        color: rgba(0, 0, 0, 0.68);
      }

      .identity-author {
        margin-top: 12px;
        font-size: 23px;
        line-height: 1.25;
        font-weight: 650;
        color: rgba(0, 0, 0, 0.52);
      }

      .side {
        padding: 70px 64px 70px 0;
        display: grid;
        grid-template-rows: 0.72fr 1.25fr 1.08fr;
        gap: 24px;
        min-height: 0;
      }

      .card {
        position: relative;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 42px;
        border: 1.8px solid rgba(255, 255, 255, 0.45);
        box-shadow:
          0 26px 70px rgba(0, 0, 0, 0.16),
          inset 0 1.5px 0 rgba(255, 255, 255, 0.62),
          inset 0 -1px 0 rgba(0, 0, 0, 0.06);
        padding: 34px 38px;
        overflow: hidden;
        backdrop-filter: blur(8px) contrast(1.08);
        -webkit-backdrop-filter: blur(8px) contrast(1.08);
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.24) 0%,
          rgba(255, 255, 255, 0.04) 42%,
          rgba(255, 255, 255, 0.16) 100%
        );
      }

      .card::after {
        content: "";
        position: absolute;
        inset: 1.5px;
        border-radius: 40px;
        pointer-events: none;
        box-shadow:
          inset 10px 12px 28px rgba(255, 255, 255, 0.16),
          inset -10px -12px 26px rgba(0, 0, 0, 0.055);
      }

      .card > * {
        position: relative;
        z-index: 1;
      }

      .card-title {
        font-size: 27px;
        font-weight: 860;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        margin: 0 0 22px;
      }

      .office-list {
        display: grid;
        gap: 16px;
      }

      .office-hours-content {
        display: grid;
        gap: 16px;
        transform: translateY(10px);
      }

      .office-row {
        display: grid;
        grid-template-columns: 34px 1fr;
        align-items: center;
        column-gap: 16px;
        font-size: 36px;
        line-height: 1.12;
        font-weight: 800;
        letter-spacing: -0.035em;
      }

      .office-row i {
        font-size: 27px;
        color: rgba(0, 0, 0, 0.58);
        text-align: center;
      }

      .office-empty {
        height: 100%;
        min-height: 145px;
        display: grid;
        place-items: center;
        text-align: center;
        transform: translateY(14px);
      }

      .office-empty i {
        font-size: 86px;
        color: rgba(0, 0, 0, 0.28);
        margin-bottom: 18px;
      }

      .office-empty-main {
        font-size: 34px;
        line-height: 1.12;
        font-weight: 820;
        letter-spacing: -0.035em;
        color: rgba(0, 0, 0, 0.62);
      }

      .qr-card {
        background: rgba(255, 255, 255, 0.05);
      }

      .qr-img {
        width: 275px;
        height: 275px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
        margin: 8px auto 26px;
        background: rgba(255, 255, 255, 0.94);
        border-radius: 22px;
        padding: 16px;
        box-shadow:
          0 10px 28px rgba(0, 0, 0, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .qr-copy {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        line-height: 1.12;
        font-weight: 820;
        letter-spacing: -0.035em;
        color: rgba(0, 0, 0, 0.62);
        white-space: nowrap;
        text-align: center;
      }

      .today-lines {
        display: grid;
        gap: 22px;
        margin: 0;
      }

      .today-line {
        display: grid;
        grid-template-columns: 34px 1fr;
        align-items: start;
        column-gap: 14px;
        font-size: 28px;
        line-height: 1.22;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: rgba(0, 0, 0, 0.66);
      }

      .today-line i {
        font-size: 25px;
        line-height: 1.2;
        color: rgba(0, 0, 0, 0.44);
        text-align: center;
        margin-top: 3px;
      }

      #moon-icon {
        font-size: 32px;
        line-height: 1;
        margin-top: 0;
      }

      .today-line strong {
        font-weight: 820;
        color: rgba(0, 0, 0, 0.78);
      }

      .moon-text {
        display: grid;
        gap: 4px;
      }

      .moon-main,
      .moon-times {
        display: block;
      }

      .moon-times {
        font-size: 0.92em;
        color: rgba(0, 0, 0, 0.58);
      }

      .moon-times strong {
        font-weight: 650;
        color: rgba(0, 0, 0, 0.58);
      }

      .pollen-text {
        display: grid;
        gap: 4px;
      }

      .pollen-main,
      .pollen-species {
        display: block;
      }

      .pollen-mini-icon {
        font-size: 0.78em !important;
        line-height: 1;
        color: rgba(0, 0, 0, 0.52) !important;
        margin: 0 2px 0 0 !important;
        transform: translateY(-0.03em);
      }

      .pollen-species {
        font-size: 0.92em;
        color: rgba(0, 0, 0, 0.58);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .forecast-strip {
        margin-top: 14px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        column-gap: 8px;
        align-items: end;
      }

      .forecast-hour {
        display: grid;
        justify-items: center;
        gap: 10px;
        min-width: 0;
      }

      .forecast-time {
        font-size: 18px;
        line-height: 1;
        font-weight: 860;
        letter-spacing: -0.035em;
        color: rgba(0, 0, 0, 0.58);
        white-space: nowrap;
      }

      .forecast-icon {
        font-size: 34px;
        line-height: 1;
        color: rgba(0, 0, 0, 0.52);
        margin-top: 3px;
      }

      .forecast-temp {
        font-size: 24px;
        line-height: 1;
        font-weight: 820;
        letter-spacing: -0.045em;
        color: rgba(0, 0, 0, 0.72);
      }
    </style>
  </head>

  <body>
    <div class="stage scale">
      <img class="bg" id="theme-bg" alt="" />
      <div class="bg-fade"></div>

      <main class="layout">
        <section class="hero">
          <h1 class="status" id="status-text">IN OFFICE</h1>
          <p class="sub" id="status-sub">as of —</p>
        </section>

        <aside class="side">
          <section class="card">
            <h2 class="card-title" id="office-title">Office Hours</h2>

            <div class="office-list" id="office-list" hidden>
              <div class="office-row">
                <i class="fa-regular fa-calendar"></i>
                <span id="office-days"></span>
              </div>
              <div class="office-row">
                <i class="fa-regular fa-clock"></i>
                <span id="office-time"></span>
              </div>
              <div class="office-row">
                <i class="fa-solid fa-location-dot"></i>
                <span id="office-location"></span>
              </div>
            </div>
          </section>

          <section class="card qr-card">
            <h2 class="card-title">Book a Time</h2>
            <img class="qr-img" id="qr" alt="Booking QR" />
            <div class="qr-copy" id="cta-text">Scan to schedule</div>
          </section>

          <section class="card">
            <h2 class="card-title">Today</h2>

            <div class="today-lines">
              <div class="today-line moon-today-line">
                <i id="moon-icon" class="wi wi-moon-alt-new"></i>
                <span class="moon-text">
                  <span class="moon-main">
                    <strong id="moon-phase">—</strong>
                    · <strong id="moon-illumination">—</strong>
                  </span>
                  <span class="moon-times">
                    ↑ <strong id="moonrise">—</strong> · ↓
                    <strong id="moonset">—</strong>
                  </span>
                </span>
              </div>

              <div class="today-line pollen-today-line">
                <i class="fa-solid fa-head-side-cough"></i>
                <span class="pollen-text">
                  <span class="pollen-main">
                    <strong id="pollen-risk">—</strong>
                    · <i class="fa-solid fa-tree pollen-mini-icon"></i>
                    <strong id="pollen-tree">—</strong>
                    · <i class="fa-solid fa-seedling pollen-mini-icon"></i>
                    <strong id="pollen-grass">—</strong>
                    · <i class="fa-solid fa-leaf pollen-mini-icon"></i>
                    <strong id="pollen-weed">—</strong>
                  </span>
                  <span class="pollen-species" id="pollen-species">—</span>
                </span>
              </div>

              <div
                class="forecast-strip"
                id="forecast-strip"
                aria-label="Next five hours weather"
              >
                <div class="forecast-hour">
                  <div class="forecast-time">Now</div>
                  <i class="forecast-icon wi wi-cloudy"></i>
                  <div class="forecast-temp">—°</div>
                </div>
                <div class="forecast-hour">
                  <div class="forecast-time">—</div>
                  <i class="forecast-icon wi wi-cloudy"></i>
                  <div class="forecast-temp">—°</div>
                </div>
                <div class="forecast-hour">
                  <div class="forecast-time">—</div>
                  <i class="forecast-icon wi wi-cloudy"></i>
                  <div class="forecast-temp">—°</div>
                </div>
                <div class="forecast-hour">
                  <div class="forecast-time">—</div>
                  <i class="forecast-icon wi wi-cloudy"></i>
                  <div class="forecast-temp">—°</div>
                </div>
                <div class="forecast-hour">
                  <div class="forecast-time">—</div>
                  <i class="forecast-icon wi wi-cloudy"></i>
                  <div class="forecast-temp">—°</div>
                </div>
              </div>
            </div>
          </section>
        </aside>

        <div class="identity quote-identity">
          <div class="identity-quote" id="identity-quote"></div>
          <div class="identity-author" id="identity-author"></div>
        </div>
      </main>
    </div>

    <script>
      const DEFAULT_BOOKING_URL =
        "https://app.reclaim.ai/m/yuyang-wang/flexible-quick-meeting";

      const GIST_ID = "f96b0e927c21a42d247b626dceae243e";
      const GIST_FILE = "status.json";
      const STATUS_SOURCE = `https://api.github.com/gists/${GIST_ID}`;
      const ASSET_BASE = "https://wangyy.phd/book-my-time/";

      const API_PROXY_BASE =
        "https://office-pollen-worker.wangyuyangyuyang.workers.dev";

      const MOON_LOCATION = "41.806634541194654,-72.25259166465403";
      const POLLEN_LOCATION = MOON_LOCATION;

      const POLLEN_PROXY_URL = `${API_PROXY_BASE}/pollen`;
      const MOON_PROXY_URL = `${API_PROXY_BASE}/moon`;
      const FORECAST_PROXY_URL = `${API_PROXY_BASE}/forecast`;

      const STATUS_MAP = {
        busy: {
          title: "IN OFFICE",
          img: `${ASSET_BASE}status-theme-in.png`,
        },
        ooo: {
          title: "OUT OF OFFICE",
          img: `${ASSET_BASE}status-theme-out.png`,
        },
        "in-meeting": {
          title: "IN MEETING",
          img: `${ASSET_BASE}status-theme-meeting.png`,
        },
      };

      function refreshGlass() {
        document.querySelectorAll(".card").forEach((card) => {
          card.style.transform = "translateZ(0)";
          card.style.backdropFilter = "blur(8.1px) contrast(1.08)";
          card.style.webkitBackdropFilter = "blur(8.1px) contrast(1.08)";

          void card.offsetHeight;

          card.style.transform = "";
          card.style.backdropFilter = "blur(8px) contrast(1.08)";
          card.style.webkitBackdropFilter = "blur(8px) contrast(1.08)";
        });
      }

      function stripJsonComments(input) {
        let out = "";
        let inStr = false;
        let esc = false;
        let inBlk = false;
        let inLine = false;
        let quote = "";

        for (let i = 0; i < input.length; i++) {
          const c = input[i];
          const n = input[i + 1];

          if (inLine) {
            if (c === "\n") {
              inLine = false;
              out += c;
            }
            continue;
          }

          if (inBlk) {
            if (c === "*" && n === "/") {
              inBlk = false;
              i++;
            }
            continue;
          }

          if (inStr) {
            out += c;

            if (esc) {
              esc = false;
              continue;
            }

            if (c === "\\") {
              esc = true;
              continue;
            }

            if (c === quote) inStr = false;
            continue;
          }

          if (c === "/" && n === "/") {
            inLine = true;
            i++;
            continue;
          }

          if (c === "/" && n === "*") {
            inBlk = true;
            i++;
            continue;
          }

          if (c === '"' || c === "'") {
            inStr = true;
            quote = c;
            out += c;
            continue;
          }

          out += c;
        }

        return out;
      }

      function setTheme(statusKey) {
        const key = String(statusKey || "busy")
          .trim()
          .toLowerCase();

        const s = STATUS_MAP[key] || STATUS_MAP.busy;

        document.getElementById("status-text").textContent = s.title;

        const bg = document.getElementById("theme-bg");

        const forceRefresh = () => {
          requestAnimationFrame(() => {
            refreshGlass();
            requestAnimationFrame(refreshGlass);
          });
        };

        bg.onload = forceRefresh;
        bg.onerror = forceRefresh;
        bg.src = s.img;

        setTimeout(forceRefresh, 900);
        setTimeout(forceRefresh, 1800);
      }

      function setQR(url) {
        const u = url || DEFAULT_BOOKING_URL;
        const qr = document.getElementById("qr");

        const svgUrl = `https://api.qrserver.com/v1/create-qr-code/?format=svg&size=420x420&data=${encodeURIComponent(u)}&color=000000&bgcolor=FFFFFF`;

        const pngUrl = `https://api.qrserver.com/v1/create-qr-code/?size=1200x1200&data=${encodeURIComponent(u)}&color=000000&bgcolor=FFFFFF`;

        qr.src = svgUrl;

        qr.onerror = () => {
          qr.onerror = null;
          qr.src = pngUrl;
        };
      }

      function formatMainUpdatedAt(s) {
        if (!s) return "—";

        const d = new Date(s);
        if (Number.isNaN(d.getTime())) return "—";

        const datePart = d.toLocaleDateString("en-US", {
          timeZone: "America/New_York",
          month: "short",
          day: "numeric",
        });

        const timePart = d.toLocaleTimeString("en-US", {
          timeZone: "America/New_York",
          hour: "numeric",
          minute: "2-digit",
        });

        return `${datePart}, ${timePart}`;
      }

      function pickQuote(quotes) {
        const fallback = [
          {
            quote:
              "Embrace light. Admire it. Love it. But above all, know light.",
            author: "George Eastman",
          },
          {
            quote: "The first thing you must learn is to see with light.",
            author: "Ansel Adams",
          },
        ];

        const list = Array.isArray(quotes) && quotes.length ? quotes : fallback;
        return list[Math.floor(Math.random() * list.length)];
      }

      function setOffice(js) {
        const title = document.getElementById("office-title");
        const list = document.getElementById("office-list");
        const oh = js.office_hours;

        const hasOfficeHours =
          oh &&
          typeof oh === "object" &&
          String(oh.days || "").trim() &&
          String(oh.time || "").trim() &&
          String(oh.location || "").trim();

        title.textContent = "Office Hours";

        if (hasOfficeHours) {
          list.innerHTML = `
            <div class="office-hours-content">
              <div class="office-row">
                <i class="fa-regular fa-calendar"></i>
                <span>${oh.days}</span>
              </div>
              <div class="office-row">
                <i class="fa-regular fa-clock"></i>
                <span>${oh.time}</span>
              </div>
              <div class="office-row">
                <i class="fa-solid fa-location-dot"></i>
                <span>${oh.location}</span>
              </div>
            </div>
          `;

          list.hidden = false;
          return;
        }

        list.innerHTML = `
          <div class="office-empty">
            <div>
              <i class="fa-solid fa-mug-saucer"></i>
              <div class="office-empty-main">By appointment</div>
            </div>
          </div>
        `;

        list.hidden = false;
      }

      function setIdentityQuote(js) {
        const quoteBox = document.getElementById("identity-quote");
        const authorBox = document.getElementById("identity-author");

        const q = pickQuote(js.office_quotes || js.quotes);

        if (!q) {
          quoteBox.textContent = "";
          authorBox.textContent = "";
          return;
        }

        const text = q.quote || q.text || "";
        const author = q.author || "";

        quoteBox.textContent = text ? `“${text}”` : "";
        authorBox.textContent = author ? `— ${author}` : "";
      }

      function formatPollenLevel(v) {
        if (v === null || v === undefined || v === "") return "—";

        const n = Number(v);
        if (Number.isNaN(n)) return String(v);

        if (n <= 0) return "0";
        if (n <= 1) return "1";
        if (n <= 2) return "2";
        if (n <= 3) return "3";
        if (n <= 4) return "4";
        return "5";
      }

      function setPollenFallback() {
        document.getElementById("pollen-risk").textContent = "—";
        document.getElementById("pollen-tree").textContent = "—";
        document.getElementById("pollen-grass").textContent = "—";
        document.getElementById("pollen-weed").textContent = "—";
        document.getElementById("pollen-species").textContent = "—";
      }

      function formatPollenRiskLabel(value) {
        const n = Number(value);

        if (!Number.isFinite(n)) return "—";
        if (n <= 0) return "None";
        if (n <= 1) return "Very Low";
        if (n <= 2) return "Low";
        if (n <= 3) return "Moderate";
        if (n <= 4) return "High";
        return "Very High";
      }

      function setPollenFromValues(values) {
        const tree = Number(values?.tree);
        const grass = Number(values?.grass);
        const weed = Number(values?.weed);

        const maxRisk = Math.max(
          Number.isFinite(tree) ? tree : 0,
          Number.isFinite(grass) ? grass : 0,
          Number.isFinite(weed) ? weed : 0,
        );

        document.getElementById("pollen-risk").textContent =
          values?.riskLabel ||
          formatPollenRiskLabel(values?.overall ?? maxRisk);

        document.getElementById("pollen-tree").textContent = formatPollenLevel(
          values?.tree,
        );

        document.getElementById("pollen-grass").textContent = formatPollenLevel(
          values?.grass,
        );

        document.getElementById("pollen-weed").textContent = formatPollenLevel(
          values?.weed,
        );

        const species =
          Array.isArray(values?.topSpecies) && values.topSpecies.length
            ? values.topSpecies.slice(0, 3).join(" · ")
            : "—";

        document.getElementById("pollen-species").textContent = species;
      }

      function splitLatLon(location) {
        const [latRaw, lonRaw] = String(location || "")
          .split(",")
          .map((x) => x.trim());

        const lat = Number(latRaw);
        const lon = Number(lonRaw);

        if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
          throw new Error("Invalid pollen location");
        }

        return { lat, lon };
      }

      function pollenScoreFromRiskLevel(riskLevel) {
        const r = String(riskLevel || "")
          .trim()
          .toLowerCase();

        if (!r || r === "none" || r === "no risk") return 0;
        if (r === "very low") return 1;
        if (r === "low") return 2;
        if (r === "moderate" || r === "medium") return 3;
        if (r === "high") return 4;
        if (r === "very high" || r === "severe") return 5;

        return null;
      }

      function pollenScoreFromItem(item) {
        const numericCandidates = [
          item?.index,
          item?.risk_index,
          item?.riskIndex,
          item?.score,
          item?.level,
        ];

        for (const candidate of numericCandidates) {
          const n = Number(candidate);
          if (Number.isFinite(n))
            return Math.max(0, Math.min(5, Math.round(n)));
        }

        const fromRisk = pollenScoreFromRiskLevel(
          item?.risk_level || item?.riskLevel,
        );
        if (fromRisk !== null) return fromRisk;

        return null;
      }

      function pollenCategoryFromItem(item, fallbackKey = "") {
        const s = [
          item?.category,
          item?.type,
          item?.species,
          item?.name,
          item?.display_name,
          item?.displayName,
          fallbackKey,
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();

        if (s.includes("tree") || s.includes("oak") || s.includes("birch")) {
          return "tree";
        }

        if (s.includes("grass")) {
          return "grass";
        }

        if (
          s.includes("weed") ||
          s.includes("ragweed") ||
          s.includes("mugwort")
        ) {
          return "weed";
        }

        return null;
      }

      function collectPollenScores(node, scores, fallbackKey = "") {
        if (!node || typeof node !== "object") return;

        if (Array.isArray(node)) {
          node.forEach((item) => collectPollenScores(item, scores));
          return;
        }

        const category = pollenCategoryFromItem(node, fallbackKey);
        const score = pollenScoreFromItem(node);

        if (category && score !== null) {
          scores[category] = Math.max(
            Number(scores[category] || 0),
            Number(score),
          );
        }

        Object.entries(node).forEach(([key, value]) => {
          if (value && typeof value === "object") {
            collectPollenScores(value, scores, key);
          }
        });
      }

      function titleCaseSpeciesName(name) {
        return String(name || "")
          .replace(/_/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .replace(/\b\w/g, (c) => c.toUpperCase());
      }

      function pollenSpeciesNameFromItem(item, fallbackKey = "") {
        return (
          item?.display_name ||
          item?.displayName ||
          item?.name ||
          item?.species ||
          fallbackKey ||
          ""
        );
      }

      function pollenRawValueFromItem(item) {
        const candidates = [
          item?.value,
          item?.concentration,
          item?.count,
          item?.grains,
          item?.grains_per_m3,
          item?.grainsPerM3,
        ];

        for (const candidate of candidates) {
          const n = Number(candidate);
          if (Number.isFinite(n)) return n;
        }

        const score = pollenScoreFromItem(item);
        return score === null ? 0 : Number(score);
      }

      function collectTopPollenSpecies(node, out, fallbackKey = "") {
        if (!node || typeof node !== "object") return;

        if (Array.isArray(node)) {
          node.forEach((item) => collectTopPollenSpecies(item, out));
          return;
        }

        const category = pollenCategoryFromItem(node, fallbackKey);
        const score = pollenScoreFromItem(node);
        const rawValue = pollenRawValueFromItem(node);
        const name = pollenSpeciesNameFromItem(node, fallbackKey);

        if (category && score !== null && name) {
          const cleaned = titleCaseSpeciesName(name);

          if (
            cleaned &&
            !["Tree", "Grass", "Weed", "Pollen"].includes(cleaned)
          ) {
            out.push({
              name: cleaned,
              category,
              score: Number(score),
              rawValue: Number(rawValue) || 0,
            });
          }
        }

        Object.entries(node).forEach(([key, value]) => {
          if (value && typeof value === "object") {
            collectTopPollenSpecies(value, out, key);
          }
        });
      }

      function getTopPollenSpecies(data) {
        const found = [];
        collectTopPollenSpecies(data, found);

        const deduped = new Map();

        found.forEach((item) => {
          const key = item.name.toLowerCase();
          const prev = deduped.get(key);

          if (
            !prev ||
            item.score > prev.score ||
            (item.score === prev.score && item.rawValue > prev.rawValue)
          ) {
            deduped.set(key, item);
          }
        });

        return [...deduped.values()]
          .sort((a, b) => b.score - a.score || b.rawValue - a.rawValue)
          .slice(0, 3)
          .map((x) => x.name);
      }

      function setPollenFromAtmospore(data) {
        const scores = {
          tree: null,
          grass: null,
          weed: null,
          overall: null,
          riskLabel: null,
          topSpecies: [],
        };

        collectPollenScores(data, scores);

        const topSpecies = getTopPollenSpecies(data);

        const maxRisk = Math.max(
          Number(scores.tree || 0),
          Number(scores.grass || 0),
          Number(scores.weed || 0),
        );

        scores.overall = maxRisk;
        scores.riskLabel = formatPollenRiskLabel(maxRisk);
        scores.topSpecies = topSpecies;

        console.log("Parsed pollen display:", scores);

        setPollenFromValues(scores);
      }

      async function loadPollen() {
        if (!POLLEN_PROXY_URL) {
          setPollenFallback();
          return;
        }

        try {
          const { lat, lon } = splitLatLon(POLLEN_LOCATION);
          const date = getLocalDateString();

          const url =
            POLLEN_PROXY_URL +
            `?lon=${encodeURIComponent(lon)}` +
            `&lat=${encodeURIComponent(lat)}` +
            `&dt=${encodeURIComponent(date)}` +
            `&_ts=${Date.now()}`;

          const res = await fetch(url, {
            cache: "no-store",
            headers: {
              accept: "application/json",
            },
          });

          if (!res.ok) throw new Error(`Pollen proxy failed: ${res.status}`);

          const data = await res.json();
          setPollenFromAtmospore(data);
        } catch (e) {
          console.error("Pollen load error:", e);
          setPollenFallback();
        }
      }

      function setToday() {
        setPollenFallback();
        setMoonFallback();
        setForecastFallback();
      }

      function getLocalDateString(date = new Date()) {
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "America/New_York",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).formatToParts(date);

        const yyyy = parts.find((p) => p.type === "year")?.value;
        const mm = parts.find((p) => p.type === "month")?.value;
        const dd = parts.find((p) => p.type === "day")?.value;

        return `${yyyy}-${mm}-${dd}`;
      }

      function normalizeAstroTime(value) {
        if (!value || typeof value !== "string") return "—";

        const s = value.trim();

        if (
          !s ||
          /^no moonrise$/i.test(s) ||
          /^no moonset$/i.test(s) ||
          /^null$/i.test(s)
        ) {
          return "—";
        }

        return s.replace(/^0/, "");
      }

      function normalizeIllumination(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) return "—";
        return `${Math.round(n)}%`;
      }

      function moonIconClassFromPhase(phase) {
        const p = String(phase || "").toLowerCase();

        if (p.includes("new")) return "wi wi-moon-alt-new";
        if (p.includes("waxing crescent"))
          return "wi wi-moon-alt-waxing-crescent-3";
        if (p.includes("first quarter")) return "wi wi-moon-alt-first-quarter";
        if (p.includes("waxing gibbous"))
          return "wi wi-moon-alt-waxing-gibbous-3";
        if (p.includes("full")) return "wi wi-moon-alt-full";
        if (p.includes("waning gibbous"))
          return "wi wi-moon-alt-waning-gibbous-3";
        if (p.includes("last quarter")) return "wi wi-moon-alt-third-quarter";
        if (p.includes("waning crescent"))
          return "wi wi-moon-alt-waning-crescent-3";

        return "wi wi-moon-alt-new";
      }

      function setMoonFallback() {
        const moonIcon = document.getElementById("moon-icon");

        if (moonIcon) {
          moonIcon.className = "wi wi-moon-alt-new";
        }

        document.getElementById("moon-phase").textContent = "—";
        document.getElementById("moon-illumination").textContent = "—";
        document.getElementById("moonrise").textContent = "—";
        document.getElementById("moonset").textContent = "—";
      }

      function setMoonFromAstro(astro) {
        const phase = astro?.moon_phase || "—";
        const illumination = normalizeIllumination(astro?.moon_illumination);
        const moonrise = normalizeAstroTime(astro?.moonrise);
        const moonset = normalizeAstroTime(astro?.moonset);

        const moonIcon = document.getElementById("moon-icon");

        if (moonIcon) {
          moonIcon.className = moonIconClassFromPhase(phase);
        }

        document.getElementById("moon-phase").textContent = phase;
        document.getElementById("moon-illumination").textContent = illumination;
        document.getElementById("moonrise").textContent = moonrise;
        document.getElementById("moonset").textContent = moonset;
      }

      async function loadMoonAstro() {
        if (!MOON_PROXY_URL) {
          setMoonFallback();
          return;
        }

        const date = getLocalDateString();

        const url =
          MOON_PROXY_URL +
          `?q=${encodeURIComponent(MOON_LOCATION)}` +
          `&dt=${encodeURIComponent(date)}` +
          `&_ts=${Date.now()}`;

        try {
          const res = await fetch(url, {
            cache: "no-store",
            headers: {
              accept: "application/json",
            },
          });

          if (!res.ok) throw new Error(`Moon proxy failed: ${res.status}`);

          const data = await res.json();
          const astro = data?.astronomy?.astro;

          if (!astro) throw new Error("Missing astronomy.astro data");

          setMoonFromAstro(astro);
        } catch (e) {
          console.error("Moon astronomy load error:", e);
          setMoonFallback();
        }
      }

      function weatherIconClassFromCode(code, isDay) {
        const c = Number(code);
        const day = Number(isDay) === 1;

        if (c === 1000) {
          return day ? "wi wi-day-sunny" : "wi wi-night-clear";
        }

        if (c === 1003) {
          return day ? "wi wi-day-cloudy" : "wi wi-night-alt-cloudy";
        }

        if (c === 1006) return "wi wi-cloudy";
        if (c === 1009) return "wi wi-cloud";

        if (c === 1030 || c === 1135 || c === 1147) return "wi wi-fog";

        if (c === 1063) {
          return day ? "wi wi-day-showers" : "wi wi-night-alt-showers";
        }

        if (c === 1066) {
          return day ? "wi wi-day-snow" : "wi wi-night-alt-snow";
        }

        if (c === 1069 || c === 1072) {
          return day ? "wi wi-day-sleet" : "wi wi-night-alt-sleet";
        }

        if (c === 1087) {
          return day
            ? "wi wi-day-thunderstorm"
            : "wi wi-night-alt-thunderstorm";
        }

        if (c >= 1150 && c <= 1171) return "wi wi-sprinkle";

        if (c >= 1180 && c <= 1201) {
          return day ? "wi wi-day-rain" : "wi wi-night-alt-rain";
        }

        if (c >= 1204 && c <= 1207) return "wi wi-sleet";

        if (c >= 1210 && c <= 1225) {
          return day ? "wi wi-day-snow" : "wi wi-night-alt-snow";
        }

        if (c === 1237 || (c >= 1261 && c <= 1264)) return "wi wi-hail";

        if (c >= 1240 && c <= 1246) {
          return day ? "wi wi-day-showers" : "wi wi-night-alt-showers";
        }

        if (c >= 1249 && c <= 1252) return "wi wi-sleet";

        if (c >= 1255 && c <= 1258) return "wi wi-snow";

        if (c >= 1273 && c <= 1282) return "wi wi-thunderstorm";

        return "wi wi-cloudy";
      }

      function formatForecastHourLabel(timeEpoch, index) {
        if (index === 0) return "Now";

        const d = new Date(timeEpoch * 1000);

        return d
          .toLocaleTimeString("en-US", {
            timeZone: "America/New_York",
            hour: "numeric",
            hour12: true,
          })
          .replace(":00", "")
          .replace(" ", "");
      }

      function setForecastFallback() {
        document.querySelectorAll(".forecast-hour").forEach((el, index) => {
          const timeBox = el.querySelector(".forecast-time");
          const iconBox = el.querySelector(".forecast-icon");
          const tempBox = el.querySelector(".forecast-temp");

          if (timeBox) timeBox.textContent = index === 0 ? "Now" : "—";
          if (iconBox) iconBox.className = "forecast-icon wi wi-cloudy";
          if (tempBox) tempBox.textContent = "—°";
        });
      }

      function setForecastFromData(data) {
        const allHours = (data?.forecast?.forecastday || []).flatMap(
          (day) => day.hour || [],
        );

        const nowEpoch = Math.floor(Date.now() / 1000);

        const nextHours = allHours
          .filter((h) => Number(h.time_epoch) >= nowEpoch - 1800)
          .slice(0, 5);

        if (nextHours.length < 5) {
          setForecastFallback();
          return;
        }

        const slots = document.querySelectorAll(".forecast-hour");

        nextHours.forEach((h, index) => {
          const slot = slots[index];
          if (!slot) return;

          const timeBox = slot.querySelector(".forecast-time");
          const iconBox = slot.querySelector(".forecast-icon");
          const tempBox = slot.querySelector(".forecast-temp");

          const tempF = Math.round(Number(h.temp_f));
          const code = h?.condition?.code;
          const isDay = Number(h.is_day) === 1;

          timeBox.textContent = formatForecastHourLabel(h.time_epoch, index);
          iconBox.className = `forecast-icon ${weatherIconClassFromCode(code, isDay)}`;
          tempBox.textContent = Number.isFinite(tempF) ? `${tempF}°` : "—°";
        });
      }

      async function loadForecast() {
        if (!FORECAST_PROXY_URL) {
          setForecastFallback();
          return;
        }

        const url =
          FORECAST_PROXY_URL +
          `?q=${encodeURIComponent(MOON_LOCATION)}` +
          `&days=2` +
          `&_ts=${Date.now()}`;

        try {
          const res = await fetch(url, {
            cache: "no-store",
            headers: {
              accept: "application/json",
            },
          });

          if (!res.ok) throw new Error(`Forecast proxy failed: ${res.status}`);

          const data = await res.json();
          setForecastFromData(data);
        } catch (e) {
          console.error("Forecast load error:", e);
          setForecastFallback();
        }
      }

      function setFixedCTA() {
        document.getElementById("cta-text").textContent = "Scan to schedule";
      }

      function applyFromJson(js) {
        document.getElementById("status-sub").textContent =
          `as of ${formatMainUpdatedAt(js.updated_at)}`;

        setOffice(js);
        setIdentityQuote(js);
        setQR(js.booking_url || DEFAULT_BOOKING_URL);
        setFixedCTA();

        // Do not reset/reload Today here.
        // Today APIs are launched once at startup.

        requestAnimationFrame(refreshGlass);

        setTheme(js.status || "busy");
      }

      async function load() {
        setQR(DEFAULT_BOOKING_URL);
        setOffice({});
        setIdentityQuote({});
        setFixedCTA();
        setToday();

        document.querySelector(".layout").style.visibility = "visible";

        setTheme("busy");

        // Launch Today APIs immediately, in parallel with Gist.
        loadPollen();
        loadMoonAstro();
        loadForecast();

        try {
          const url = new URL(STATUS_SOURCE);
          url.searchParams.set("_ts", Date.now());

          const res = await fetch(url.toString(), {
            cache: "no-store",
            headers: { Accept: "application/vnd.github+json" },
          });

          if (!res.ok) {
            return;
          }

          const data = await res.json();

          const file =
            data.files &&
            (data.files[GIST_FILE] || data.files[GIST_FILE.toUpperCase()]);

          if (!file || !file.content) {
            return;
          }

          const clean = stripJsonComments(file.content);
          const js = JSON.parse(clean);

          applyFromJson(js);
        } catch (e) {
          console.error("Status load error:", e);
        }
      }

      load();
    </script>
  </body>
