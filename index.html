<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Door Status — Yuyang Wang</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="favicons/icon-512x512.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="384x384"
      href="favicons/icon-384x384.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="favicons/icon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="152x152"
      href="favicons/icon-152x152.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="144x144"
      href="favicons/icon-144x144.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="favicons/icon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="favicons/icon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="72x72"
      href="favicons/icon-72x72.png"
    />
    <link rel="manifest" href="favicons/manifest.json" />
    <meta name="color-scheme" content="light" />
    <style>
      /* === Monochrome, Landscape, Pixel-consistent Canvas === */
      :root {
        /* Design canvas matches your e‑ink panel (landscape). */
        --design-w: 1872; /* px */
        --design-h: 1404; /* px */
        --fg: #000;
        --bg: #fff;
        --g7: #777;
        --g6: #666;
        --g4: #444;
        --g2: #222;
        --g9: #999;
        --line: #000; /* heavy lines for e‑ink clarity */
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }
      body {
        display: grid;
        place-items: start;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
      }

      /* Fixed-size stage scaled to viewport width (no reflow). */
      .stage {
        width: calc(var(--design-w) * 1px);
        height: calc(var(--design-h) * 1px);
        position: relative;
        background: #fff;
      }
      .scale {
        transform-origin: top left;
        transform: scale(calc(100vw / (var(--design-w) * 1px)));
      }
      /* keep viewport height equal to scaled canvas; hide scrollbars */
      body {
        min-height: calc(100vw * (var(--design-h) / var(--design-w)));
        overflow: hidden;
      }

      /* Layout: Top 2/3 status; Bottom 1/3 split left/right */
      .status-area {
        position: absolute;
        inset: 0 auto auto 0;
        width: 100%;
        height: 66.666%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 60px;
      }
      .status-wrap {
        width: 100%;
      }

      .status-tag {
        display: inline-block;
        border: 8px solid var(--line);
        padding: 16px 28px;
        letter-spacing: 2px;
        font: 800 48px/1 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
      }
      .status-text {
        margin: 28px 0 10px;
        letter-spacing: -1px;
        font: 800 220px/0.95 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
      }
      .status-sub {
        opacity: 0.85;
        letter-spacing: 0.2px;
        font: 600 46px/1.35 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
      }

      .divider {
        position: absolute;
        left: 0;
        top: 66.666%;
        width: 100%;
        height: 0;
        border-top: 10px solid var(--line);
      }

      .bottom {
        position: absolute;
        left: 0;
        top: 66.666%;
        width: 100%;
        height: 33.333%;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .panel {
        padding: 36px 48px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .panel + .panel {
        border-left: 10px solid var(--line);
      }

      .h {
        font: 800 72px/1.2 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        margin: 0 0 10px;
      }
      .t {
        font: 600 52px/1.4 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        margin: 4px 0;
      }
      .muted {
        opacity: 0.65;
        font-weight: 600;
      }

      /* QR block: black-only SVG via external generator to avoid gray edges */
      .qr-row {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 28px;
        align-items: center;
      }
      .qr {
        width: 360px;
        height: 360px;
        background: #000;
        mask: center/contain no-repeat;
        -webkit-mask: center/contain no-repeat;
      }

      .cta {
        font: 800 64px/1.15 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
      }
      .footnote {
        font: 600 40px/1.35 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        opacity: 0.7;
      }

      /* Hairline helpers (use sparingly on e‑ink) */
      .hair {
        border-top: 3px solid var(--line);
        opacity: 0.2;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div
      class="stage scale"
      aria-label="Monochrome door display for e‑ink (landscape)"
    >
      <!-- TOP: Status (2/3) -->
      <section class="status-area">
        <div class="status-wrap">
          <div class="status-tag" id="status-tag">STATUS</div>
          <div class="status-text" id="status-text">IN MEETING</div>
          <div class="status-sub" id="status-sub">
            Please check back later • 请稍后再来
          </div>
        </div>
      </section>

      <div class="divider" aria-hidden="true"></div>

      <!-- BOTTOM: 1/3 split -->
      <section class="bottom">
        <!-- Left: Office Hours -->
        <div class="panel">
          <h2 class="h">Office Hours</h2>
          <p class="t" id="office-line-1">Mon 14:00–16:00</p>
          <p class="t" id="office-line-2">ECE Building Room 3xx</p>
          <div class="hair"></div>
          <p class="t muted" id="office-note">Walk‑ins welcome • 以现场为准</p>
        </div>

        <!-- Right: CTA + QR -->
        <div class="panel">
          <div class="qr-row">
            <div class="qr" id="qr"></div>
            <div>
              <div class="cta" id="cta">
                Can’t make any?<br />Book my time →
              </div>
              <p class="footnote" id="qr-note">Scan to open booking page</p>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      // ===== Config =====
      const BOOKING_URL =
        "https://app.reclaim.ai/m/yuyang-wang/flexible-quick-meeting";
      // Optional: swap to read remote JSON (uncomment & host a status.json)
      // const STATUS_SOURCE = new URL('./status.json', location.href).href; // or a Gist raw URL

      // Status dictionary: key -> big headline + polite subline (door‑friendly, lightly witty)
      const STATUS_COPY = {
        "in-meeting": {
          title: "IN MEETING",
          sub: "On a call / 在开会 — I’ll be right back",
        },
        busy: {
          title: "BUSY",
          sub: "Heads‑down focus / 专注中 — Please knock if urgent",
        },
        knock: {
          title: "KNOCK KNOCK",
          sub: "If the door is open, come on in / 欢迎轻敲",
        },
        ooo: {
          title: "OUT OF OFFICE",
          sub: "Back soon / 暂离 — Please book a time",
        },
      };

      // URL param overrides (?status=in-meeting&sub=...)
      const q = new URLSearchParams(location.search);
      const statusKey = (q.get("status") || "in-meeting").toLowerCase();

      function setStatus(key) {
        const m = STATUS_COPY[key] || STATUS_COPY["in-meeting"];
        document.getElementById("status-text").textContent = m.title;
        document.getElementById("status-sub").textContent =
          q.get("sub") || m.sub;
      }

      // Office hours overrides
      if (q.get("oh1"))
        document.getElementById("office-line-1").textContent = q.get("oh1");
      if (q.get("oh2"))
        document.getElementById("office-line-2").textContent = q.get("oh2");
      if (q.get("ohnote"))
        document.getElementById("office-note").textContent = q.get("ohnote");

      // QR: render via external generator as a pure black mask to avoid anti‑aliasing gray
      function setQR(url) {
        const size = 1200; // high‑res for crisp downscale on e‑ink
        const api = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(
          url
        )}&color=000000&bgcolor=FFFFFF`;
        const $qr = document.getElementById("qr");
        // Use the PNG as a CSS mask -> solid black foreground, ensures binary output on panel
        $qr.style.webkitMaskImage = `url(${api})`;
        $qr.style.maskImage = `url(${api})`;
      }

      function init() {
        setStatus(statusKey);
        setQR(BOOKING_URL);
        // Optional: fetch STATUS_SOURCE to drive status dynamically
        // try{ fetch(STATUS_SOURCE,{cache:'no-store'}).then(r=>r.json()).then(js=>{
        //   if(js.status) setStatus(String(js.status).toLowerCase());
        //   if(js.office_hours){
        //     const [l1,l2] = String(js.office_hours).split(' @ ');
        //     if(l1) document.getElementById('office-line-1').textContent = l1.trim();
        //     if(l2) document.getElementById('office-line-2').textContent = l2.trim();
        //   }
        //   if(js.booking_url) setQR(js.booking_url);
        // }); }catch(e){}
      }

      init();
    </script>
  </body>
</html>
