<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Need a Meeting?</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="favicons/icon-512x512.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="384x384"
      href="favicons/icon-384x384.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="favicons/icon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="152x152"
      href="favicons/icon-152x152.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="144x144"
      href="favicons/icon-144x144.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="favicons/icon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="favicons/icon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="72x72"
      href="favicons/icon-72x72.png"
    />
    <link rel="manifest" href="favicons/manifest.json" />
    <meta name="color-scheme" content="light" />
    <style>
      /* === Monochrome, Landscape, Pixel-consistent Canvas === */
      :root {
        /* Design canvas matches your e‑ink panel (landscape). */
        --design-w: 1872; /* px */
        --design-h: 1404; /* px */
        --fg: #000;
        --bg: #fff;
        --g7: #777;
        --g6: #666;
        --g4: #444;
        --g2: #222;
        --g9: #999;
        --line: #000; /* heavy lines for e‑ink clarity */
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }
      body {
        display: grid;
        place-items: start;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
      }

      /* Fixed-size stage scaled to viewport width (no reflow). */
      .stage {
        width: calc(var(--design-w) * 1px);
        height: calc(var(--design-h) * 1px);
        position: relative;
        background: #fff;
      }
      .scale {
        transform-origin: top left;
        transform: scale(calc(100vw / (var(--design-w) * 1px)));
      }
      /* keep viewport height equal to scaled canvas; hide scrollbars */
      body {
        min-height: calc(100vw * (var(--design-h) / var(--design-w)));
        /* overflow: hidden; */
      }

      /* Layout: Top 2/3 status; Bottom 1/3 split left/right */
      .status-area {
        position: absolute;
        inset: 0 auto auto 0;
        width: 100%;
        height: 66.666%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 60px;
      }
      .status-wrap {
        width: 100%;
      }

      .status-tag {
        display: inline-block;
        border: 8px solid var(--line);
        padding: 16px 28px;
        letter-spacing: 2px;
        font: 800 48px/1 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
      }
      .status-text {
        margin: 28px 0 10px;
        letter-spacing: -1px;
        font: 800 200px/0.95 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
      }
      .status-sub {
        opacity: 0.85;
        letter-spacing: 0.2px;
        font: 600 46px/1.35 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
      }

      .divider {
        position: absolute;
        left: 0;
        top: 66.666%;
        width: 100%;
        height: 0;
        border-top: 10px solid var(--line);
      }

      .bottom {
        position: absolute;
        left: 0;
        top: 66.666%;
        width: 100%;
        height: 33.333%;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .panel {
        padding: 36px 48px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .panel + .panel {
        border-left: 10px solid var(--line);
      }

      .h {
        font: 800 72px/1.2 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        margin: 0 0 10px;
      }
      .t {
        font: 600 52px/1.4 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        margin: 4px 0;
      }
      .muted {
        opacity: 0.65;
        font-weight: 600;
      }

      /* QR block: black-only SVG via external generator to avoid gray edges */
      .qr-row {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 28px;
        align-items: center;
      }
      .qr {
        width: 360px;
        height: 360px;
        background: #000;
        mask: center/contain no-repeat;
        -webkit-mask: center/contain no-repeat;
      }
      .qr-img {
        width: 360px;
        height: 360px;
        display: block;
        /* 让电子墨水屏呈现硬边不糊 */
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #fff;
      }

      .cta {
        font: 800 48px/1.15 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
      }
      .footnote {
        font: 600 32px/1.35 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        opacity: 0.7;
      }
      .script {
        font: 600 22px/1.35 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        opacity: 0.7;
      }

      /* Hairline helpers (use sparingly on e‑ink) */
      .hair {
        border-top: 3px solid var(--line);
        opacity: 0.2;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div
      class="stage scale"
      aria-label="Monochrome door display for e-ink (landscape)"
    >
      <!-- TOP: Status (2/3) -->
      <section class="status-area">
        <div class="status-wrap">
          <div class="status-tag" id="status-tag">STATUS</div>
          <div class="status-text" id="status-text">ON A CALL</div>
          <div class="status-sub" id="status-sub">
            I'm currently in a meeting. Please check back later.
          </div>
        </div>
      </section>

      <div class="divider" aria-hidden="true"></div>

      <!-- BOTTOM: 1/3 split -->
      <section class="bottom">
        <!-- Left: Office Hours -->
        <div class="panel">
          <h2 class="h">Office Hours</h2>
          <p class="t" id="office-line-1">Mon 14:00-16:00</p>
          <p class="t" id="office-line-2">ECE Building Room 3xx</p>
          <!-- <div class="hair"></div> -->
          <!-- <p class="t muted" id="office-note">Walk-ins welcome • 以现场为准</p> -->
        </div>

        <!-- Right: CTA + QR -->
        <div class="panel">
          <div class="qr-row">
            <div>
              <div class="cta" id="cta">
                Can't make any?<br />Book my time →
              </div>
              <p class="footnote" id="qr-note">Scan to open booking page</p>
              <div class="hair"></div>
              <p class="script" id="qr-script">
                🚧 Experimental, feedback welcome 🚧
              </p>
            </div>
            <img
              class="qr-img"
              id="qr"
              alt="QR code"
              width="250"
              height="250"
              decoding="sync"
            />
          </div>
        </div>
      </section>
    </div>

    <script>
      // ===== Config =====
      const DEFAULT_BOOKING_URL =
        "https://app.reclaim.ai/m/yuyang-wang/flexible-quick-meeting";
      // Provide a remote JSON to drive the page. Use a Gist Raw URL or local status.json during dev.
      // Example schema below.
      const STATUS_SOURCE =
        location.hostname === "localhost" || location.hostname === "127.0.0.1"
          ? new URL("./status.json", location.href).href
          : "https://gist.githubusercontent.com/your_user/your_gist_id/raw/status.json"; // <-- replace with your Gist Raw

      // Status dictionary: key -> big headline + polite subline (door‑friendly, lightly witty)
      const STATUS_COPY = {
        "in-meeting": {
          title: "ON A CALL",
          sub: "I'm currently in a meeting. Please check back or book a time.",
        },
        busy: {
          title: "FOCUS TIME",
          sub: "I'm trying to get some work done. Please knock if urgent.",
        },
        knock: {
          title: "KNOCK KNOCK",
          sub: "I'm available for a quick chat if we haven't scheduled.",
        },
        ooo: {
          title: "STEPPED OUT",
          sub: "I'm currently out of office. Please check back or book a time.",
        },
        weekend: {
          title: "WEEKEND MODE",
          sub: "Catching up on projects. Please email me or book a time.",
        },
      };

      // URL param overrides (?status=in-meeting&sub=...)
      const q = new URLSearchParams(location.search);

      function setStatus(key, subOverride) {
        const m = STATUS_COPY[key] || STATUS_COPY["in-meeting"];
        document.getElementById("status-text").textContent = m.title;
        document.getElementById("status-sub").textContent =
          subOverride || m.sub;
      }

      function setOffice(oh) {
        if (!oh) return;
        if (typeof oh === "string") {
          const [l1, l2] = oh.split(" @ ");
          if (l1)
            document.getElementById("office-line-1").textContent = l1.trim();
          if (l2)
            document.getElementById("office-line-2").textContent = l2.trim();
        } else if (typeof oh === "object") {
          if (oh.line1)
            document.getElementById("office-line-1").textContent = oh.line1;
          if (oh.line2)
            document.getElementById("office-line-2").textContent = oh.line2;
          if (oh.note)
            document.getElementById("office-note").textContent = oh.note;
        }
      }

      function setQR(url) {
        const u = url || DEFAULT_BOOKING_URL;
        const $qr = document.getElementById("qr");

        // 1) 先尝试 SVG（矢量，缩放清晰）
        const svgUrl = `https://api.qrserver.com/v1/create-qr-code/?format=svg&size=360x360&data=${encodeURIComponent(
          u
        )}&color=000000&bgcolor=FFFFFF`;

        // 2) 兜底 PNG（高分辨率，保证清晰）
        const pngUrl = `https://api.qrserver.com/v1/create-qr-code/?size=1200x1200&data=${encodeURIComponent(
          u
        )}&color=000000&bgcolor=FFFFFF`;

        // 先设 SVG
        $qr.src = svgUrl;

        // 如果 SVG 加载异常则回退到 PNG
        $qr.onerror = () => {
          $qr.onerror = null;
          $qr.src = pngUrl;
        };
      }

      function applyFromJson(js) {
        const k = String(js.status || "").toLowerCase();
        const sub = js.sub || undefined;
        setStatus(k || "in-meeting", sub);

        setOffice(js.office || js.office_hours);

        const booking = js.booking_url || DEFAULT_BOOKING_URL;
        setQR(booking);

        // Optional CTA override
        if (js.cta) document.getElementById("cta").innerHTML = js.cta;
        if (js.qr_note)
          document.getElementById("qr-note").textContent = js.qr_note;
        if (js.qr_script)
          document.getElementById("qr-script").textContent = js.qr_script;
      }

      async function load() {
        // Defaults first (in case fetch fails)
        setStatus("in-meeting");
        setQR(DEFAULT_BOOKING_URL);

        try {
          const res = await fetch(STATUS_SOURCE, {
            cache: "no-store",
            headers: { Accept: "application/json" },
          });
          if (res.ok) {
            const js = await res.json();
            applyFromJson(js);
          }
        } catch (e) {
          /* silent fallback */
        }

        // URL overrides have the final say
        const s = (q.get("status") || "").toLowerCase();
        if (s) setStatus(s, q.get("sub") || undefined);
        if (q.get("oh1"))
          document.getElementById("office-line-1").textContent = q.get("oh1");
        if (q.get("oh2"))
          document.getElementById("office-line-2").textContent = q.get("oh2");
        if (q.get("ohnote"))
          document.getElementById("office-note").textContent = q.get("ohnote");
        if (q.get("cta"))
          document.getElementById("cta").innerHTML = q.get("cta");
        if (q.get("qr")) setQR(q.get("qr"));
      }

      load();
    </script>

    <!--
  ===== Sample status.json (either local or Gist Raw) =====
  {
    "status": "busy",                    // in-meeting | busy | knock | ooo
    "sub": "Back at 14:30 / 14:30 返回", // optional subline override
    "office": {                           // or use "office_hours": "Mon 14:00–16:00 @ ECE Room 3xx"
      "line1": "Mon 14:00–16:00",
      "line2": "ECE Building Room 3xx",
      "note":  "Walk-ins welcome • 以现场为准"
    },
    "booking_url": "https://app.reclaim.ai/m/yuyang-wang/flexible-quick-meeting",
    "cta": "Can’t make any?<br/>Book my time →", // optional HTML
    "qr_note": "Scan to open booking page",
    "updated_at": "2025-10-17T10:00:00-04:00"
  }
  --></body>
</html>
