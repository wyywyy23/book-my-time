<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Office Door Sign v2</title>
  <meta name="color-scheme" content="light" />
  <style>
    :root {
      --design-w: 1872;
      --design-h: 1404;
      --black: #050505;
      --ink: #111;
      --muted: #5f5f5f;
      --soft: #8b8b8b;
      --line: #181818;
      --panel: #f6f6f6;
      --card: #ffffff;
      --wash: #eeeeee;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: start;
      min-height: calc(100vw * (var(--design-h) / var(--design-w)));
      overflow: hidden;
    }

    .stage {
      width: calc(var(--design-w) * 1px);
      height: calc(var(--design-h) * 1px);
      transform-origin: top left;
      transform: scale(calc(100vw / (var(--design-w) * 1px)));
      display: grid;
      grid-template-columns: 66.8% 33.2%;
      background: #fff;
      border: 4px solid var(--black);
    }

    .presence {
      position: relative;
      display: grid;
      grid-template-rows: 55% 45%;
      min-width: 0;
      overflow: hidden;
    }

    .presence-copy {
      padding: 92px 86px 34px 92px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-bottom: 4px solid var(--line);
      background: #fff;
    }

    .eyebrow {
      font-size: 34px;
      line-height: 1;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 46px;
    }

    .status {
      font-size: 176px;
      line-height: 0.92;
      font-weight: 900;
      letter-spacing: -0.055em;
      text-transform: uppercase;
      max-width: 1050px;
    }

    .status-sub {
      margin-top: 42px;
      font-size: 46px;
      line-height: 1.22;
      font-weight: 560;
      color: var(--muted);
      max-width: 940px;
    }

    .theme {
      position: relative;
      overflow: hidden;
      background: #eee;
    }

    .theme img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(1) contrast(1.04);
    }

    .theme::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.16), rgba(255,255,255,0) 45%);
      pointer-events: none;
    }

    .sidebar {
      border-left: 5px solid var(--line);
      display: grid;
      grid-template-rows: 28.5% 35.5% 36%;
      background: var(--card);
    }

    .block {
      padding: 54px 54px 44px 54px;
      display: grid;
      align-content: center;
      border-bottom: 4px solid var(--line);
      min-width: 0;
    }
    .block:last-child { border-bottom: 0; }

    .block-head {
      display: grid;
      grid-template-columns: 64px 1fr;
      align-items: start;
      gap: 30px;
      margin-bottom: 22px;
    }

    .icon {
      width: 64px;
      height: 64px;
      stroke: var(--black);
      stroke-width: 7;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .kicker {
      font-size: 30px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: .05em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .value {
      font-size: 50px;
      line-height: 1.18;
      font-weight: 720;
      letter-spacing: -0.025em;
    }

    .note {
      margin-top: 18px;
      margin-left: 94px;
      font-size: 31px;
      line-height: 1.3;
      font-weight: 560;
      color: var(--muted);
    }

    .booking {
      grid-template-rows: auto 1fr;
    }

    .qr-row {
      display: grid;
      grid-template-columns: 240px 1fr;
      align-items: center;
      gap: 42px;
      margin-top: 6px;
    }

    .qr-img {
      width: 240px;
      height: 240px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #fff;
      border: 0;
    }

    .qr-text {
      font-size: 38px;
      line-height: 1.18;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .arrow {
      margin-top: 22px;
      font-size: 62px;
      line-height: 1;
      font-weight: 800;
    }

    .info-grid {
      display: grid;
      gap: 25px;
      margin-top: 8px;
    }

    .info-row {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      align-items: center;
      gap: 24px;
      min-height: 56px;
    }

    .mini-icon {
      width: 50px;
      height: 50px;
      stroke: var(--black);
      stroke-width: 6;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      justify-self: center;
    }

    .label {
      font-size: 29px;
      line-height: 1;
      font-weight: 850;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    .metric {
      font-size: 32px;
      line-height: 1;
      font-weight: 650;
      text-align: right;
      white-space: nowrap;
    }

    .state-meeting .presence-copy { background: var(--black); color: #fff; }
    .state-meeting .status-sub { color: #d7d7d7; }
    .state-meeting .eyebrow { color: #fff; }

    .state-office .presence-copy { background: #fff; color: var(--black); }
    .state-away .presence-copy { background: #f2f2f2; color: var(--black); }
    .state-away .theme img { opacity: .72; contrast: .95; }

    @media screen and (max-width: 900px) {
      body { overflow: auto; }
    }
  </style>
</head>
<body>
  <main class="stage state-office" id="stage" aria-label="Office door sign">
    <section class="presence" aria-label="Presence status">
      <div class="presence-copy">
        <div class="eyebrow">Status</div>
        <div class="status" id="status-text">IN OFFICE</div>
        <div class="status-sub" id="status-sub">Around today.</div>
      </div>
      <figure class="theme" aria-hidden="true">
        <img id="theme-img" src="status-theme-placeholder.png" alt="" />
      </figure>
    </section>

    <aside class="sidebar" aria-label="Office information">
      <section class="block office-block">
        <div class="block-head">
          <svg class="icon" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="24" />
            <path d="M32 17v17l13 8" />
          </svg>
          <div>
            <div class="kicker">Office Hours</div>
            <div class="value" id="office-hours">Mon–Fri<br />9:00–17:00</div>
          </div>
        </div>
        <div class="note" id="office-note">Usually available by appointment.</div>
      </section>

      <section class="block booking">
        <div class="kicker">Book a Meeting</div>
        <div class="qr-row">
          <img class="qr-img" id="qr" alt="Meeting booking QR code" decoding="sync" />
          <div>
            <div class="qr-text" id="qr-note">Schedule a meeting</div>
            <div class="arrow">→</div>
          </div>
        </div>
      </section>

      <section class="block info-block">
        <div class="kicker" id="info-title">Today</div>
        <div class="info-grid" id="info-grid">
          <div class="info-row">
            <svg class="mini-icon" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 12v40M12 32h40M18 18l28 28M46 18L18 46" /></svg>
            <div class="label">Pollen</div><div class="metric">High</div>
          </div>
          <div class="info-row">
            <svg class="mini-icon" viewBox="0 0 64 64" aria-hidden="true"><path d="M12 38c12 0 10-12 22-12 8 0 9 6 18 6M10 48h42M14 22h20" /></svg>
            <div class="label">AQI</div><div class="metric">Good</div>
          </div>
          <div class="info-row">
            <svg class="mini-icon" viewBox="0 0 64 64" aria-hidden="true"><path d="M20 42h28a11 11 0 0 0 0-22 17 17 0 0 0-32 7 8 8 0 0 0 4 15z" /></svg>
            <div class="label">Weather</div><div class="metric">21°C</div>
          </div>
          <div class="info-row">
            <svg class="mini-icon" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8a16 16 0 0 0-8 30v10h16V38A16 16 0 0 0 32 8zM25 56h14" /></svg>
            <div class="label">Note</div><div class="metric">Step outside</div>
          </div>
        </div>
      </section>
    </aside>
  </main>

  <script>
    const DEFAULT_BOOKING_URL = "https://app.reclaim.ai/m/yuyang-wang/flexible-quick-meeting";
    const GIST_ID = "f96b0e927c21a42d247b626dceae243e";
    const GIST_FILE = "status.json";
    const STATUS_SOURCE = `https://api.github.com/gists/${GIST_ID}`;

    const STATUS_COPY = {
      "in-office": { title: "IN OFFICE", sub: "Around today.", cls: "state-office" },
      office: { title: "IN OFFICE", sub: "Around today.", cls: "state-office" },
      in: { title: "IN OFFICE", sub: "Around today.", cls: "state-office" },
      "in-meeting": { title: "IN MEETING", sub: "In a meeting now.", cls: "state-meeting" },
      meeting: { title: "IN MEETING", sub: "In a meeting now.", cls: "state-meeting" },
      "out-of-office": { title: "OUT OF OFFICE", sub: "Away from the office.", cls: "state-away" },
      ooo: { title: "OUT OF OFFICE", sub: "Away from the office.", cls: "state-away" },
      out: { title: "OUT OF OFFICE", sub: "Away from the office.", cls: "state-away" }
    };

    function normalizeStatus(raw) {
      const k = String(raw || "in-office").trim().toLowerCase();
      return STATUS_COPY[k] ? k : "in-office";
    }

    function setStatus(key, subOverride) {
      const stage = document.getElementById("stage");
      const k = normalizeStatus(key);
      const m = STATUS_COPY[k];
      stage.classList.remove("state-office", "state-meeting", "state-away");
      stage.classList.add(m.cls);
      document.getElementById("status-text").textContent = m.title;
      document.getElementById("status-sub").textContent = subOverride || m.sub;
    }

    function setQR(url) {
      const u = url || DEFAULT_BOOKING_URL;
      const qr = document.getElementById("qr");
      const svgUrl = `https://api.qrserver.com/v1/create-qr-code/?format=svg&size=420x420&data=${encodeURIComponent(u)}&color=000000&bgcolor=FFFFFF`;
      const pngUrl = `https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&data=${encodeURIComponent(u)}&color=000000&bgcolor=FFFFFF`;
      qr.src = svgUrl;
      qr.onerror = () => { qr.onerror = null; qr.src = pngUrl; };
    }

    function stripJsonComments(input) {
      let out = "", inStr = false, esc = false, inBlk = false, inLine = false, quote = "";
      for (let i = 0; i < input.length; i++) {
        const c = input[i], n = input[i + 1];
        if (inLine) { if (c === "\n") { inLine = false; out += c; } continue; }
        if (inBlk) { if (c === "*" && n === "/") { inBlk = false; i++; } continue; }
        if (inStr) { out += c; if (esc) { esc = false; continue; } if (c === "\\") { esc = true; continue; } if (c === quote) inStr = false; continue; }
        if (c === "/" && n === "/") { inLine = true; i++; continue; }
        if (c === "/" && n === "*") { inBlk = true; i++; continue; }
        if (c === '"' || c === "'") { inStr = true; quote = c; out += c; continue; }
        out += c;
      }
      return out;
    }

    function renderInfo(items) {
      if (!Array.isArray(items) || items.length === 0) return;
      const root = document.getElementById("info-grid");
      root.innerHTML = "";
      items.slice(0, 4).forEach((item) => {
        const row = document.createElement("div");
        row.className = "info-row";
        row.innerHTML = `
          <svg class="mini-icon" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="18"/><path d="M32 14v36M14 32h36"/></svg>
          <div class="label"></div><div class="metric"></div>`;
        row.querySelector(".label").textContent = item.label || item.name || "Info";
        row.querySelector(".metric").textContent = item.value || item.metric || "—";
        root.appendChild(row);
      });
    }

    function applyFromJson(js) {
      setStatus(js.status, js.sub || js.status_sub);
      setQR(js.booking_url || DEFAULT_BOOKING_URL);

      if (js.theme_image) document.getElementById("theme-img").src = js.theme_image;
      if (js.office_hours) document.getElementById("office-hours").innerHTML = String(js.office_hours).replace(/\n/g, "<br>");
      if (js.office_note) document.getElementById("office-note").textContent = js.office_note;
      if (js.qr_note) document.getElementById("qr-note").textContent = js.qr_note;
      if (js.info_title) document.getElementById("info-title").textContent = js.info_title;
      if (js.info_items) renderInfo(js.info_items);
    }

    async function load() {
      setStatus("in-office");
      setQR(DEFAULT_BOOKING_URL);
      try {
        const url = new URL(STATUS_SOURCE);
        url.searchParams.set("_ts", Date.now());
        const res = await fetch(url.toString(), { cache: "no-store", headers: { Accept: "application/vnd.github+json" } });
        if (!res.ok) return;
        const data = await res.json();
        const file = data.files && (data.files[GIST_FILE] || data.files[GIST_FILE.toUpperCase()]);
        if (!file || !file.content) return;
        const js = JSON.parse(stripJsonComments(file.content));
        applyFromJson(js);
      } catch (e) {
        console.error("status load error:", e);
      }
    }

    load();
  </script>
</body>
</html>
