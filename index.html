<style>
  :root {
    --w: 1872;
    --h: 1404;
    --ink: #0b0b0b;
    --muted: #565656;
    --soft: #777;
    --card: rgba(255, 255, 255, 0.68);
    --card-border: rgba(0, 0, 0, 0.10);
    --shadow: rgba(0, 0, 0, 0.10);
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    color: var(--ink);
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    display: grid;
    place-items: start;
  }

  .stage {
    width: calc(var(--w) * 1px);
    height: calc(var(--h) * 1px);
    position: relative;
    overflow: hidden;
  }

  .scale {
    transform-origin: top left;
    transform: scale(calc(100vw / (var(--w) * 1px)));
  }

  .layout {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 430px;
  }

  .theme-img {
    position: absolute;
    left: -20px;
    bottom: -10px;
    width: 1320px;
    height: 760px;
    object-fit: cover;
    opacity: 0.58;
    filter: grayscale(1);
    z-index: 0;
  }

  .theme-fade {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 1320px;
    height: 920px;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,1) 0%,
      rgba(255,255,255,0.82) 36%,
      rgba(255,255,255,0.35) 64%,
      rgba(255,255,255,0.04) 100%
    );
    z-index: 1;
    pointer-events: none;
  }

  .hero {
    position: relative;
    z-index: 2;
    padding: 440px 90px 90px 108px;
  }

  .status {
    font-size: 176px;
    line-height: 0.88;
    font-weight: 880;
    letter-spacing: -0.075em;
    text-transform: uppercase;
    margin: 0 0 34px;
  }

  .sub {
    max-width: 720px;
    font-size: 42px;
    line-height: 1.22;
    font-weight: 580;
    color: var(--muted);
    margin: 0;
  }

  .identity {
    position: absolute;
    left: 110px;
    bottom: 86px;
    z-index: 3;
    font-size: 25px;
    line-height: 1.32;
    font-weight: 650;
    color: rgba(0,0,0,0.66);
    letter-spacing: -0.01em;
  }

  .identity strong {
    display: block;
    font-size: 30px;
    color: rgba(0,0,0,0.82);
    margin-bottom: 4px;
  }

  .side {
    position: relative;
    z-index: 4;
    padding: 78px 56px 78px 0;
    display: grid;
    grid-template-rows: 0.82fr 1.38fr 1fr;
    gap: 34px;
  }

  .card {
    background: var(--card);
    border: 2px solid var(--card-border);
    border-radius: 34px;
    box-shadow: 0 18px 55px var(--shadow);
    padding: 38px 38px;
    overflow: hidden;
  }

  .card-title {
    font-size: 27px;
    font-weight: 860;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    margin: 0 0 22px;
  }

  .office-main {
    font-size: 43px;
    line-height: 1.08;
    font-weight: 780;
    letter-spacing: -0.035em;
    margin: 0;
  }

  .office-note {
    margin-top: 18px;
    font-size: 26px;
    line-height: 1.25;
    font-weight: 600;
    color: var(--muted);
  }

  .qr-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding-top: 42px;
    padding-bottom: 42px;
  }

  .qr-img {
    width: 255px;
    height: 255px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    margin: 10px 0 26px;
  }

  .qr-copy {
    font-size: 34px;
    line-height: 1.12;
    font-weight: 780;
    letter-spacing: -0.035em;
  }

  .qr-sub {
    margin-top: 10px;
    font-size: 24px;
    line-height: 1.25;
    color: var(--muted);
    font-weight: 600;
  }

  .today-main {
    font-size: 31px;
    line-height: 1.25;
    font-weight: 740;
    margin: 0 0 22px;
    letter-spacing: -0.025em;
  }

  .today-meta {
    display: grid;
    gap: 12px;
    font-size: 25px;
    line-height: 1.25;
    font-weight: 620;
    color: var(--muted);
  }

  .today-meta span {
    color: var(--ink);
    font-weight: 760;
  }
</style>

<div class="stage scale">
  <img class="theme-img" src="status-theme-placeholder.png" />
  <div class="theme-fade"></div>

  <main class="layout">
    <section class="hero">
      <h1 class="status" id="status-text">IN OFFICE</h1>
      <p class="sub" id="status-sub">Available today.</p>
    </section>

    <aside class="side">
      <section class="card">
        <h2 class="card-title">Office Hours</h2>
        <p class="office-main" id="office-main">Mon–Fri<br />9:00–17:00</p>
        <div class="office-note" id="office-note">By appointment when needed</div>
      </section>

      <section class="card qr-card">
        <h2 class="card-title">Book a Time</h2>
        <img class="qr-img" id="qr" alt="Booking QR" />
        <div class="qr-copy">Schedule a meeting</div>
        <div class="qr-sub">Scan to open booking page</div>
      </section>

      <section class="card">
        <h2 class="card-title">Today</h2>
        <p class="today-main" id="today-main">
          Thinking about photonic chiplet interconnects.
        </p>
        <div class="today-meta">
          <div>Pollen: <span id="pollen">High</span></div>
          <div>AQI: <span id="aqi">Good</span></div>
        </div>
      </section>
    </aside>

    <div class="identity">
      <strong>Yuyang Wang</strong>
      Electrical &amp; Computer Engineering<br />
      University of Connecticut
    </div>
  </main>
</div>
