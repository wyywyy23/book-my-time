<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Need a Meeting?</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="favicons/icon-512x512.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="384x384"
      href="favicons/icon-384x384.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="favicons/icon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="152x152"
      href="favicons/icon-152x152.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="144x144"
      href="favicons/icon-144x144.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="favicons/icon-128x128.png"
    />
    <link
      rel="icon"

    />
    <link
      rel="icon"

      sizes="72x72"
      href="favicons/icon-72x72.png"
    />
    <link rel="manifest" href="favicons/manifest.json" />
    <meta name="color-scheme" content="light" />
    <style>
      /* === Monochrome, Landscape, Pixel-consistent Canvas === */
      :root {
        /* Design canvas matches your e‑ink panel (landscape). */
        --design-w: 1872; /* px */
        --design-h: 1404; /* px */
        --fg: #000;
        --bg: #fff;
        --g7: #777;
        --g6: #666;
        --g4: #444;
        --g2: #222;
        --g9: #999;
        --line: #000; /* heavy lines for e‑ink clarity */
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }
      body {
        display: grid;
        place-items: start;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
      }

      /* Fixed-size stage scaled to viewport width (no reflow). */
      .stage {
        width: calc(var(--design-w) * 1px);
        height: calc(var(--design-h) * 1px);
        position: relative;
        background: #fff;
      }
      .scale {
        transform-origin: top left;
        transform: scale(calc(100vw / (var(--design-w) * 1px)));
      }
      /* keep viewport height equal to scaled canvas; hide scrollbars */
      body {
        min-height: calc(100vw * (var(--design-h) / var(--design-w)));
        /* overflow: hidden; */
      }

      /* Layout: Top 2/3 status; Bottom 1/3 split left/right */
      .status-area {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 66.666%;
        display: flex;
        flex-direction: column; /* 竖向排布三行文字 */
        justify-content: center; /* 垂直居中 */
        align-items: center; /* 水平居中 */
        text-align: center;
        padding: 0; /* 去掉 40px/60px 的内边距偏移 */
      }
      .status-wrap {
        display: flex;
        flex-direction: column;
        align-items: center; /* 文字块水平居中 */
        text-align: center;
        width: auto; /* 不再占满 100%，避免看起来偏右 */
        max-width: 100%;
        transform: translateX(
          -0.5%
        ); /* 轻微左移，修正视觉中心；需要可改为 -1%/-0.25% */
      }

      .status-tag {
        display: inline-block;
        border: 8px solid var(--line);
        padding: 16px 28px;
        letter-spacing: 2px;
        font: 800 48px/1 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        margin-bottom: 36px; /* ← 新增这一行：原来几乎为 0，现在增加垂直间距 */
      }
      .status-text {
        margin: 28px 0 10px;
        letter-spacing: -1px;
        font: 800 200px/0.95 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
      }
      .status-sub {
        opacity: 0.85;
        letter-spacing: 0.2px;
        font: 600 46px/1.35 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
      }

      .divider {
        position: absolute;
        left: 0;
        top: 66.666%;
        width: 100%;
        height: 0;
        border-top: 10px solid var(--line);
      }

      .bottom {
        position: absolute;
        left: 0;
        top: 66.666%;
        width: 100%;
        height: 33.333%;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .panel {
        padding: 36px 48px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .panel + .panel {
        border-left: 10px solid var(--line);
      }

      .h {
        font: 800 72px/1.2 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        margin: 0 0 10px;
      }
      .t {
        font: 600 52px/1.4 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        margin: 4px 0;
      }
      .muted {
        opacity: 0.65;
        font-weight: 600;
      }

      /* QR block: black-only SVG via external generator to avoid gray edges */
      .qr-row {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 68px;
        align-items: center;
      }
      .qr {
        width: 320px;
        height: 320px;
        background: #000;
        mask: center/contain no-repeat;
        -webkit-mask: center/contain no-repeat;
      }
      .qr-img {
        width: 320px;
        height: 320px;
        display: block;
        /* 让电子墨水屏呈现硬边不糊 */
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #fff;
      }

      .cta {
        font: 800 48px/1.15 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
      }
      .footnote {
        font: 600 32px/1.35 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        opacity: 0.7;
      }
      .script {
        font: 600 22px/1.35 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        opacity: 0.7;
      }

      /* Hairline helpers (use sparingly on e‑ink) */
      .hair {
        border-top: 3px solid var(--line);
        opacity: 0.2;
        margin-top: 12px;
      }

      /* Office Hours – weekly mini-gantt */
      /* 标题改 ~48 */
      .oh-title {
        font: 800 48px/1.2 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
      }

      /* 左下周时间轴整体 */
      .oh {
        display: grid;
        gap: 10px;
      }

      /* 顶部刻度（只渲染一行） */
      .oh-scale {
        position: relative;
        height: 30px;
        margin-bottom: 4px;
      }
      .oh-scale .tick {
        position: absolute;
        top: 0;
        width: 2px;
        height: 18px;
        background: #000;
        opacity: 0.35;
      }
      .oh-scale .tick-label {
        position: absolute;
        top: 18px;
        transform: translateX(-50%);
        font: 600 24px/1 JetBrains Mono, ui-monospace, SFMono-Regular, Menlo,
          Consolas, "Liberation Mono", monospace;
        opacity: 0.75;
      }

      /* 每一行：左=星期几，右=条 */
      .oh-row {
        display: grid;
        grid-template-columns: 86px 1fr;
        gap: 10px;
        align-items: center;
      }

      /* 星期几：等宽 + 全大写 */
      .oh-day {
        font: 700 36px/1 JetBrains Mono, ui-monospace, SFMono-Regular, Menlo,
          Consolas, "Liberation Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        text-align: right;
      }

      /* 顶部刻度：用与 .oh-row 相同的两列网格，让刻度与 bar 对齐 */
      .oh-scale {
        display: grid;
        grid-template-columns: 86px 1fr;
        align-items: start;
        height: 40px;
        margin-bottom: 6px;
      }
      .oh-scale-bar {
        position: relative;
        height: 40px;
      }
      .oh-scale-bar .tick-label {
        position: absolute;
        top: 0;
        transform: translateX(-50%);
        font: 600 20px/1 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        opacity: 0.75;
      }
      .oh-scale-bar .tick {
        position: absolute;
        top: 22px;
        width: 2px;
        height: 14px;
        background: #000;
        opacity: 0.35;
      }

      /* 条：去圆角空心，改为浅灰底，黑色区段叠加 */
      .oh-bar {
        position: relative;
        height: 34px;
        background: #e9e9e9;
        border: none;
        outline: none;
        overflow: visible;
      }
      .oh-slot {
        position: absolute;
        top: 0;
        bottom: 0;
        background: #000;
      }
      /* 标签：默认放黑段右侧；若放不下 JS 会改到左侧 */
      .oh-slot-label {
        position: absolute;
        top: 50%;
        transform: translate(8px, -50%);
        font: 600 20px/1 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        white-space: nowrap;
        color: #000;
        pointer-events: none;
      }
      .oh-slot-label.left {
        transform: translate(-8px, -50%) translateX(-100%);
        text-align: right;
      }
      /* 左侧放置时 JS 会加上 .left 类 */
      .oh-slot-label.left {
        transform: translate(-8px, -50%) translateX(-100%);
        text-align: right;
      }

      .oh-bar::before,
      .oh-bar::after,
      .oh-tick {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div
      class="stage scale"
      aria-label="Monochrome door display for e-ink (landscape)"
    >
      <!-- TOP: Status (2/3) -->
      <section class="status-area">
        <div class="status-wrap">
          <div class="status-tag" id="status-tag">STATUS</div>
          <div class="status-text" id="status-text">ON A CALL</div>
          <div class="status-sub" id="status-sub">
            I'm currently in a meeting. Please check back in a moment.
          </div>
        </div>
      </section>

      <div class="divider" aria-hidden="true"></div>

      <!-- BOTTOM: 1/3 split -->
      <section class="bottom">
        <!-- Left: Office Hours -->
        <!-- 左下：Office Hours 可视化（周时间轴） -->
        <div class="panel">
          <h2 class="h oh-title">Office Hours</h2>
          <div class="oh-scale">
            <div></div>
            <div class="oh-scale-bar" id="oh-scale-bar"></div>
          </div>
          <div id="oh-week" class="oh"></div>
        </div>

        <!-- Right: CTA + QR -->
        <div class="panel">
          <div class="qr-row">
            <div>
              <div class="cta" id="cta">
                Can't make any?<br />Book my time →
              </div>
              <p class="footnote" id="qr-note">Scan to open booking page</p>
              <div class="hair"></div>
              <p class="script" id="qr-script">
                🚧 Experimental; feedback welcome 🚧
              </p>
            </div>
            <img class="qr-img" id="qr" alt="QR code" decoding="sync" />
          </div>
        </div>
      </section>
    </div>

    <script>
      // ===== Config =====
      const DEFAULT_BOOKING_URL =
        "https://app.reclaim.ai/m/yuyang-wang/flexible-quick-meeting";
      // Provide a remote JSON to drive the page. Use a Gist Raw URL or local status.json during dev.
      // Example schema below.
      // ---- 改成你的 Gist 信息 ----
      const GIST_ID = "f96b0e927c21a42d247b626dceae243e";
      const GIST_FILE = "status.json";
      const STATUS_SOURCE = `https://api.github.com/gists/${GIST_ID}`;
      // ----------------------------

      // Status dictionary: key -> big headline + polite subline (door‑friendly, lightly witty)
      const STATUS_COPY = {
        "in-meeting": {
          title: "ON A CALL",
          sub: "I'm currently in a meeting. Please check back in a moment.",
        },
        busy: {
          title: "FOCUS TIME",
          sub: "I'm trying to get some work done. Please knock if urgent.",
        },
        knock: {
          title: "KNOCK KNOCK",
          sub: "I'm available for a quick chat if we haven't scheduled.",
        },
        ooo: {
          title: "STEPPED OUT",
          sub: "I'm currently out of office. Please check back or book a time.",
        },
        weekend: {
          title: "WEEKEND MODE",
          sub: "Please email me or book a time. Have a wonderful weekend!",
        },
      };

      function setStatus(key, subOverride) {
        const m = STATUS_COPY[key] || STATUS_COPY["busy"];
        document.getElementById("status-text").textContent = m.title;
        document.getElementById("status-sub").textContent =
          subOverride || m.sub;
      }

      function setOffice(oh) {
        if (!oh) return;
        if (typeof oh === "string") {
          const [l1, l2] = oh.split(" @ ");
          if (l1)
            document.getElementById("office-line-1").textContent = l1.trim();
          if (l2)
            document.getElementById("office-line-2").textContent = l2.trim();
        } else if (typeof oh === "object") {
          if (oh.line1)
            document.getElementById("office-line-1").textContent = oh.line1;
          if (oh.line2)
            document.getElementById("office-line-2").textContent = oh.line2;
          if (oh.note)
            document.getElementById("office-note").textContent = oh.note;
        }
      }

      function setQR(url) {
        const u = url || DEFAULT_BOOKING_URL;
        const $qr = document.getElementById("qr");

        // 1) 先尝试 SVG（矢量，缩放清晰）
        const svgUrl = `https://api.qrserver.com/v1/create-qr-code/?format=svg&size=360x360&data=${encodeURIComponent(
          u
        )}&color=000000&bgcolor=FFFFFF`;

        // 2) 兜底 PNG（高分辨率，保证清晰）
        const pngUrl = `https://api.qrserver.com/v1/create-qr-code/?size=1200x1200&data=${encodeURIComponent(
          u
        )}&color=000000&bgcolor=FFFFFF`;

        // 先设 SVG
        $qr.src = svgUrl;

        // 如果 SVG 加载异常则回退到 PNG
        $qr.onerror = () => {
          $qr.onerror = null;
          $qr.src = pngUrl;
        };
      }

      // —— 安全去注释：支持 // 与 /* */，避免误删字符串里的 // ——
      function stripJsonComments(input) {
        let out = "",
          inStr = false,
          esc = false,
          inBlk = false,
          inLine = false,
          quote = "";
        for (let i = 0; i < input.length; i++) {
          const c = input[i],
            n = input[i + 1];
          if (inLine) {
            if (c === "\n") {
              inLine = false;
              out += c;
            }
            continue;
          }
          if (inBlk) {
            if (c === "*" && n === "/") {
              inBlk = false;
              i++;
            }
            continue;
          }
          if (inStr) {
            out += c;
            if (esc) {
              esc = false;
              continue;
            }
            if (c === "\\") {
              esc = true;
              continue;
            }
            if (c === quote) {
              inStr = false;
            }
            continue;
          }
          if (c === "/" && n === "/") {
            inLine = true;
            i++;
            continue;
          }
          if (c === "/" && n === "*") {
            inBlk = true;
            i++;
            continue;
          }
          if (c === '"' || c === "'") {
            inStr = true;
            quote = c;
            out += c;
            continue;
          }
          out += c;
        }
        return out;
      }

      function applyFromJson(js) {
        const raw = js.status;
        const k = String(raw || "")
          .trim()
          .toLowerCase(); // ← 加 trim()
        const sub = js.sub || undefined;
        console.log("[status] parsed:", { raw, k });
        setStatus(k || "busy", sub);

        // 从 office.line2 里尽量抽取地点作为默认地点（如果 schedule 项没有给）
        const defaultLoc =
          js.office && js.office.line2
            ? String(js.office.line2)
                .replace(/.*(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2})\s*/, "")
                .trim()
            : "";

        if (Array.isArray(js.schedule)) {
          renderOfficeHours(js.schedule, {
            start: "09:00",
            end: "17:00",
            days: ["Mon", "Tue", "Wed", "Thu", "Fri"],
            defaultLoc,
          });
        } else if (js.office_hours) {
          // 兼容旧的 office_hours 字符串：只画一天一段
          const s = String(js.office_hours);
          const dayMap = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
          const foundDay = dayMap.find((d) =>
            s.toLowerCase().includes(d.toLowerCase())
          );
          const m = s.match(/(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2})/);
          const day = foundDay || "Mon";
          const ranges = m ? [[m[1], m[2]]] : [];
          renderOfficeHours([{ day, ranges }], {
            start: "09:00",
            end: "17:00",
            days: ["Mon", "Tue", "Wed", "Thu", "Fri"],
            defaultLoc,
          });
        } else {
          renderOfficeHours([], {
            start: "09:00",
            end: "17:00",
            days: ["Mon", "Tue", "Wed", "Thu", "Fri"],
          });
        }
        // setOffice(js.office || js.office_hours);

        const booking = js.booking_url || DEFAULT_BOOKING_URL;
        setQR(booking);

        if (js.cta) document.getElementById("cta").innerHTML = js.cta;
        if (js.qr_note)
          document.getElementById("qr-note").textContent = js.qr_note;
        if (js.qr_script)
          document.getElementById("qr-script").textContent = js.qr_script;
      }

      // "HH:MM" -> 分钟
      function t2m(s) {
        const [h, m] = s.split(":").map(Number);
        return h * 60 + (m || 0);
      }

      // 渲染周时间轴（顶部刻度 + 灰底条 + 智能标签放置）
      function renderOfficeHours(schedule, opts) {
        const root = document.getElementById("oh-week");
        if (!root) return;
        root.innerHTML = "";

        const cfg = Object.assign(
          {
            start: "09:00",
            end: "17:00",
            days: ["Mon", "Tue", "Wed", "Thu", "Fri"],
            defaultLoc: "",
          },
          opts || {}
        );

        const minM = t2m(cfg.start),
          maxM = t2m(cfg.end),
          span = Math.max(1, maxM - minM);

        /* 顶部刻度：9/11/13/15/17，对齐 bar；文字在上、竖线在下 */
        const scaleBar = document.getElementById("oh-scale-bar");
        if (scaleBar) {
          scaleBar.innerHTML = "";
          const step = 60; // 1h
          const first = Math.ceil(minM / step) * step;
          for (let m = first; m <= maxM; m += step) {
            const pct = ((m - minM) / span) * 100;
            const hour = Math.floor(m / 60); // 9 / 10 / 11 / ...
            const lab = document.createElement("div");
            lab.className = "tick-label";
            lab.style.left = pct + "%";
            lab.textContent = String(hour);
            const tick = document.createElement("div");
            tick.className = "tick";
            tick.style.left = pct + "%";
            scaleBar.appendChild(lab);
            scaleBar.appendChild(tick);
          }
        }

        /* 归一化数据：{ MON:[[s,e,loc],...], ... } */
        const map = {};
        (cfg.days || []).forEach((d) => (map[d.toUpperCase()] = []));
        if (Array.isArray(schedule)) {
          schedule.forEach((item) => {
            const dRaw = (item.day || item.D || "").slice(0, 3).toUpperCase();
            const d = map[dRaw] ? dRaw : (cfg.days[0] || "MON").toUpperCase();
            (item.ranges || item.slots || []).forEach((r) => {
              if (Array.isArray(r) && r.length >= 2) {
                const loc =
                  (r[2] && String(r[2]).trim()) || cfg.defaultLoc || "";
                map[d].push([r[0], r[1], loc]);
              }
            });
          });
        }

        /* 各行渲染 */
        (cfg.days || Object.keys(map)).forEach((dayRaw) => {
          const day = dayRaw.toUpperCase();
          const row = document.createElement("div");
          row.className = "oh-row";

          const lab = document.createElement("div");
          lab.className = "oh-day";
          lab.textContent = day;
          const bar = document.createElement("div");
          bar.className = "oh-bar";

          (map[day] || []).forEach(([s, e, loc]) => {
            const sm = Math.max(minM, t2m(s)),
              em = Math.min(maxM, t2m(e));
            if (em <= sm) return;

            const leftPct = ((sm - minM) / span) * 100;
            const widthPct = ((em - sm) / span) * 100;

            const slot = document.createElement("div");
            slot.className = "oh-slot";
            slot.style.left = leftPct + "%";
            slot.style.width = widthPct + "%";
            bar.appendChild(slot);

            // 标签：默认放右侧；布局完成后检查越界再切左侧
            const label = document.createElement("div");
            label.className = "oh-slot-label";
            const timeText = `${s}–${e}`;
            label.textContent = loc ? `${timeText} · ${loc}` : timeText;
            label.style.left = leftPct + widthPct + "%";
            bar.appendChild(label);

            // 用 rAF 等一帧，确保尺寸和缩放稳定后再检测
            requestAnimationFrame(() => {
              const barRect = bar.getBoundingClientRect();
              const labRect = label.getBoundingClientRect();
              if (labRect.right > barRect.right - 4) {
                label.classList.add("left");
                label.style.left = leftPct + "%";
              }
            });
          });

          row.appendChild(lab);
          row.appendChild(bar);
          root.appendChild(row);
        });
      }

      async function load() {
        // 默认显示占位内容（以防网络失败）
        setStatus("busy");
        setQR(DEFAULT_BOOKING_URL);

        try {
          // 1️⃣ 通过 GitHub API 拉取 Gist（而不是 Raw 链接）
          const url = new URL(STATUS_SOURCE);
          url.searchParams.set("_ts", Date.now()); // 防缓存
          const res = await fetch(url.toString(), {
            cache: "no-store",
            headers: { Accept: "application/vnd.github+json" },
          });

          // 2️⃣ 网络错误或非 2xx 时直接返回
          if (!res.ok) {
            console.warn("Gist fetch failed:", res.status);
            return;
          }

          // 3️⃣ 解析 JSON（包含多个文件）
          const data = await res.json();
          const file =
            data.files &&
            (data.files[GIST_FILE] || data.files[GIST_FILE.toUpperCase()]);
          if (!file || !file.content) {
            console.warn("Gist file not found:", GIST_FILE);
            return;
          }

          // 4️⃣ 允许文件中出现 // 或 /* */ 注释
          const clean = stripJsonComments(file.content);

          // 5️⃣ 尝试解析为对象
          let js;
          try {
            js = JSON.parse(clean);
          } catch (e) {
            console.error("JSON parse error:", e);
            document.getElementById("status-sub").textContent =
              "status.json parse error";
            return;
          }

          // 6️⃣ 成功解析后更新页面
          applyFromJson(js);
          console.log("[status] applied:", js);
        } catch (e) {
          console.error("Gist load error:", e);
          document.getElementById("status-sub").textContent =
            "status.json fetch error";
        }
      }

      load();
    </script>
  </body>
</html>
