<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-ink Status Page — Mock</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* --- Design constants (monochrome) --- */
      :root {
        --design-w: 1872; /* px */
        --design-h: 1404; /* px (2:3 landscape) */
        --fg: #000;
        --bg: #fff;
        --g1: #111;
        --g2: #222;
        --g3: #333;
        --g6: #666;
        --g9: #999;
        --gC: #ccc;
        --gE: #eee;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }
      body {
        display: grid;
        place-items: start;
      }

      /* Scale the whole design to exactly fit viewport width (no reflow) */
      .stage {
        width: calc(var(--design-w) * 1px);
        height: calc(var(--design-h) * 1px);
        position: relative;
        background: #fff;
      }
      .scale {
        transform-origin: top left;
        transform: scale(calc(100vw / (var(--design-w) * 1px)));
      }

      /* Prevent vertical scrollbar by matching body height to scaled canvas */
      @media (min-width: 0px) {
        body {
          min-height: calc(100vw * (var(--design-h) / var(--design-w)));
          overflow: hidden;
        }
      }

      /* --- Grid layout: Top 2/3 status, Bottom 1/3 split left/right --- */
      .status-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 66.666%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .status-inner {
        text-align: center;
        padding: 40px;
        width: 100%;
      }
      .status-tag {
        display: inline-block;
        border: 6px solid var(--g2);
        padding: 18px 28px;
        font: 800 40px/1 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        letter-spacing: 2px;
        color: var(--g2);
      }
      .status-text {
        font: 800 200px/0.95 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        letter-spacing: -1px;
        margin: 28px 0 16px;
        color: #000;
      }
      .status-sub {
        font: 600 40px/1.4 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        color: #000;
        opacity: 0.75;
      }

      .divider {
        position: absolute;
        left: 0;
        top: 66.666%;
        width: 100%;
        height: 0;
        border-top: 8px solid #000;
      }

      .bottom {
        position: absolute;
        left: 0;
        top: 66.666%;
        width: 100%;
        height: 33.333%;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .panel {
        padding: 40px 48px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .panel + .panel {
        border-left: 8px solid #000;
      }

      .heading {
        font: 800 48px/1.2 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        margin: 0 0 18px 0;
      }
      .text {
        font: 600 36px/1.45 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        color: #000;
        margin: 0;
      }

      /* QR block */
      .qr-row {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 28px;
        align-items: center;
      }
      .qr {
        width: 280px;
        height: 280px;
        background: #000;
        mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="white"/><rect x="8" y="8" width="28" height="28" fill="black"/><rect x="84" y="8" width="28" height="28" fill="black"/><rect x="8" y="84" width="28" height="28" fill="black"/><rect x="40" y="40" width="40" height="40" fill="black"/><rect x="92" y="64" width="12" height="12" fill="black"/><rect x="64" y="92" width="12" height="12" fill="black"/></svg>')
          center/cover no-repeat;
      }
      .cta {
        font: 800 40px/1.2 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
      }
      .muted {
        color: #000;
        opacity: 0.65;
        font: 600 32px/1.4 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
      }

      /* Light hairlines for e‑ink clarity */
      .hair {
        border-top: 2px solid #000;
        opacity: 0.2;
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <div
      class="stage scale"
      role="img"
      aria-label="Monochrome design mockup for e-ink status page"
    >
      <!-- TOP: Status (2/3) -->
      <section class="status-area">
        <div class="status-inner">
          <div class="status-tag">STATUS</div>
          <div class="status-text">IN MEETING</div>
          <p class="status-sub">Please check back later • 请稍后再来</p>
        </div>
      </section>

      <div class="divider" aria-hidden="true"></div>

      <!-- BOTTOM: split 1/3 into two columns -->
      <section class="bottom">
        <!-- Left: Office hours -->
        <div class="panel">
          <h2 class="heading">Office Hours</h2>
          <p class="text">Mon 14:00–16:00</p>
          <p class="text">ECE Building Room 3xx</p>
          <div class="hair"></div>
          <p class="muted">欢迎直接来访（以现场为准）</p>
        </div>

        <!-- Right: CTA + QR -->
        <div class="panel">
          <div class="qr-row">
            <div class="qr" aria-label="QR placeholder"></div>
            <div>
              <div class="cta">Can’t make any?<br />Book my time →</div>
              <p class="muted" style="margin-top: 10px">
                Scan the code to open booking page
              </p>
            </div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
