<style>
  :root {
    --w: 1872;
    --h: 1404;

    --ink: #111;
    --muted: #555;
    --soft: #777;
    --card: rgba(255, 255, 255, 0.62);
    --card-border: rgba(0, 0, 0, 0.12);
    --shadow: rgba(0, 0, 0, 0.10);
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    color: var(--ink);
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  body {
    display: grid;
    place-items: start;
  }

  .stage {
    width: calc(var(--w) * 1px);
    height: calc(var(--h) * 1px);
    position: relative;
    overflow: hidden;
  }

  .scale {
    transform-origin: top left;
    transform: scale(calc(100vw / (var(--w) * 1px)));
  }

  .layout {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 430px;
  }

  .hero {
    position: relative;
    padding: 100px 110px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }

  .theme-img {
    position: absolute;
    left: 0;
    right: 430px;
    bottom: 0;
    width: calc(100% - 430px);
    height: 48%;
    object-fit: cover;
    opacity: 0.68;
    filter: grayscale(1);
    z-index: 0;
  }

  .theme-fade {
    position: absolute;
    left: 0;
    right: 430px;
    bottom: 0;
    height: 62%;
    background: linear-gradient(
      to bottom,
      rgba(255,255,255,1) 0%,
      rgba(255,255,255,0.75) 34%,
      rgba(255,255,255,0.15) 100%
    );
    z-index: 1;
    pointer-events: none;
  }

  .status-content {
    position: relative;
    z-index: 2;
    max-width: 1060px;
  }

  .eyebrow {
    font-size: 34px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 44px;
  }

  .status {
    font-size: 190px;
    line-height: 0.92;
    font-weight: 850;
    letter-spacing: -0.065em;
    text-transform: uppercase;
    margin: 0 0 44px;
  }

  .sub {
    max-width: 780px;
    font-size: 46px;
    line-height: 1.22;
    font-weight: 520;
    color: var(--muted);
    margin: 0;
  }

  .side {
    position: relative;
    z-index: 3;
    padding: 70px 56px 70px 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 34px;
  }

  .card {
    background: var(--card);
    border: 2px solid var(--card-border);
    border-radius: 34px;
    box-shadow: 0 18px 55px var(--shadow);
    padding: 38px 38px;
  }

  .card-title {
    font-size: 28px;
    font-weight: 850;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    margin: 0 0 24px;
  }

  .office-main {
    font-size: 46px;
    line-height: 1.18;
    font-weight: 760;
    margin: 0;
  }

  .office-note,
  .info-row {
    font-size: 28px;
    line-height: 1.3;
    font-weight: 560;
    color: var(--muted);
  }

  .office-note {
    margin-top: 16px;
  }

  .qr-card {
    display: grid;
    grid-template-columns: 190px 1fr;
    gap: 28px;
    align-items: center;
  }

  .qr-img {
    width: 190px;
    height: 190px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .qr-copy {
    font-size: 34px;
    line-height: 1.18;
    font-weight: 760;
  }

  .qr-sub {
    margin-top: 12px;
    font-size: 25px;
    line-height: 1.25;
    color: var(--muted);
    font-weight: 560;
  }

  .info-list {
    display: grid;
    gap: 18px;
  }

  .info-row {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    align-items: baseline;
    column-gap: 18px;
  }

  .info-icon {
    font-size: 30px;
    text-align: center;
  }

  .info-label {
    font-weight: 760;
    color: var(--ink);
  }

  .info-value {
    font-weight: 680;
    color: var(--muted);
  }
</style>

<div class="stage scale">
  <img class="theme-img" src="status-theme-placeholder.png" />
  <div class="theme-fade"></div>

  <main class="layout">
    <section class="hero">
      <div class="status-content">
        <div class="eyebrow">Status</div>
        <h1 class="status" id="status-text">IN OFFICE</h1>
        <p class="sub" id="status-sub">I am around today.</p>
      </div>
    </section>

    <aside class="side">
      <section class="card">
        <h2 class="card-title">Office Hours</h2>
        <p class="office-main" id="office-main">Mon–Fri<br />9:00–17:00</p>
        <div class="office-note" id="office-note">By appointment when needed</div>
      </section>

      <section class="card qr-card">
        <img class="qr-img" id="qr" alt="Booking QR" />
        <div>
          <div class="card-title">Book a Time</div>
          <div class="qr-copy">Schedule a meeting</div>
          <div class="qr-sub">Scan to open booking page</div>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">Today</h2>
        <div class="info-list">
          <div class="info-row">
            <div class="info-icon">✣</div>
            <div class="info-label">Pollen</div>
            <div class="info-value" id="pollen">High</div>
          </div>
          <div class="info-row">
            <div class="info-icon">≈</div>
            <div class="info-label">AQI</div>
            <div class="info-value" id="aqi">Good</div>
          </div>
          <div class="info-row">
            <div class="info-icon">◌</div>
            <div class="info-label">Note</div>
            <div class="info-value" id="today-note">Thinking in photons</div>
          </div>
        </div>
      </section>
    </aside>
  </main>
</div>
